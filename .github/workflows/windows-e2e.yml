name: Windows E2E

# Runs the Rust unit tests plus the WebDriver suite (windows/e2e) against a real build of
# the Windows app, on an actual Windows machine — this is what makes "does the Windows
# app work" answerable without a local VM. windows-build.yml stays focused on producing
# the release artifact; this one is purely about catching regressions before they ship.
on:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-e2e.yml'
  pull_request:
    paths:
      - 'windows/**'
  workflow_dispatch: {}

jobs:
  test:
    name: Rust + WebDriver tests
    # Pinned, not windows-latest: the windows-2025 image ships a WebView2 runtime
    # (152.0.4191.66) that never opens its DevTools port under msedgedriver, so every
    # WebDriver session fails with "DevToolsActivePort file doesn't exist" — a known
    # runner-image regression, not anything in this app or config:
    # https://github.com/actions/runner-images/issues/14738 (confirmed fixed on
    # windows-2022). Revisit windows-latest once that's patched upstream.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Install npm dependencies
        working-directory: windows
        run: npm install

      # tauri::generate_context!() reads frontendDist ("../dist") at COMPILE time, for
      # every cargo invocation including `cargo test` — not just `tauri build`, which is
      # the only thing that normally triggers this via its beforeBuildCommand hook.
      - name: Copy frontend assets into dist/
        working-directory: windows
        run: npm run copy-assets

      - name: Cargo test (unit tests)
        working-directory: windows/src-tauri
        run: cargo test

      # Installs a msedgedriver build matched to whatever WebView2 runtime is actually on
      # this runner, rather than pinning a version by hand and having it drift out of sync
      # — see https://tauri.app/develop/tests/webdriver/ci/.
      - name: Install matching msedgedriver
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          $PWD.Path >> $env:GITHUB_PATH

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      # Built here as its own step so a compile failure shows up clearly, rather than
      # buried inside the wdio config's onPrepare hook.
      - name: Cargo build (release)
        working-directory: windows/src-tauri
        run: cargo build --release

      # Diagnostic: this app has never actually been run in CI before (windows-build.yml
      # only compiles + packages it) — confirm it launches and survives a few seconds on
      # its own before blaming tauri-driver/msedgedriver for a failed WebDriver session.
      - name: Smoke-test the built exe launches
        working-directory: windows/src-tauri
        shell: pwsh
        run: |
          $p = Start-Process -PassThru .\target\release\stickit-windows.exe
          Start-Sleep -Seconds 5
          if ($p.HasExited) {
            throw "stickit-windows.exe exited on its own within 5s (exit code $($p.ExitCode))"
          }
          Write-Host "still running after 5s, PID $($p.Id)"
          Stop-Process -Id $p.Id -Force

      - name: WebDriverIO E2E suite
        working-directory: windows
        run: npm run test:e2e
