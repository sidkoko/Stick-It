name: Build Windows

# Two triggers, two jobs' worth of intent: pushes to main just prove the thing still
# compiles, while a `win-v*` tag cuts an actual Windows release. macOS ships from `v*`
# tags and is built by hand on a Mac — the two channels never touch each other, which is
# what keeps UpdateChecker from offering a Windows installer to Mac users.
on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'
    tags: ['win-v*']
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # needed to attach the installer to a release
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        working-directory: windows
        run: npm install

      - name: Build Tauri app
        working-directory: windows
        run: npm run tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: stickit-windows-installer
          path: windows/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Only on a win-v* tag. Creates the release if it doesn't exist yet, so pushing the
      # tag is the whole ritual — no clicking around in the GitHub UI first.
      - name: Attach installer to the release
        if: startsWith(github.ref, 'refs/tags/win-v')
        working-directory: windows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `gh release view` failing is how we ask "does this release exist yet?", so a
          # non-zero exit here must stay a value, not an exception. GitHub's pwsh wrapper
          # sets $ErrorActionPreference='stop', and whether that turns a native command's
          # exit code into a terminating error depends on the runner's PowerShell version
          # — pinned explicitly so this doesn't hinge on which one the image ships.
          $PSNativeCommandUseErrorActionPreference = $false

          $tag = $env:GITHUB_REF_NAME
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $exe) { throw "no installer found to attach" }

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Stick-It for Windows $tag" --notes "Windows build. Run the installer; SmartScreen will warn about an unknown publisher — click More info, then Run anyway."
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)" }
          }

          gh release upload $tag $exe.FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed ($LASTEXITCODE)" }
